<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="product_title">Vendly - Product</title>
  <link rel="icon" href="./assets/vendly-logo-DwGj9RJp.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/product-Bxlw5lbf.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/main-BwG8sT61.js">
  <link rel="stylesheet" crossorigin href="./assets/styles-CgVpEuEN.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-container">
    <a href="index.html" class="navbar-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
        <path d="M17,18C15.89,18 15,18.89 15,20A2,2 0 0,0 17,22A2,2 0 0,0 19,20C19,18.89 18.1,18 17,18M1,2V4H3L6.6,11.59L5.24,14.04C5.09,14.32 5,14.65 5,15A2,2 0 0,0 7,17H19V15H7.42A0.25,0.25 0 0,1 7.17,14.75C7.17,14.7 7.18,14.66 7.2,14.63L8.1,13H15.55C16.3,13 16.96,12.58 17.3,11.97L20.88,5.5C20.95,5.34 21,5.17 21,5A1,1 0 0,0 20,4H5.21L4.27,2M7,18C5.89,18 5,18.89 5,20A2,2 0 0,0 7,22A2,2 0 0,0 9,20C9,18.89 8.1,18 7,18Z"/>
      </svg>
      VENDLY
    </a>

    <button class="icon-btn hamburger-btn" id="hamburgerBtn">☰</button>

    <div class="navbar-links">
      <a href="balance.html" class="balance-badge" id="balanceBadge" style="display:none;"><span>€0.00</span></a>
      <a href="index.html" class="btn-nav" data-i18n="viewItems">View Items</a>
      <button class="btn-sell" id="sellBtn"><span data-i18n="sellItems">Sell Items</span></button>

      <!-- Pages Dropdown -->
      <div class="dropdown" id="pagesDropdown">
        <button class="dropdown-btn">☰</button>
        <div class="dropdown-menu">
          <a href="settings.html" class="dropdown-item" data-i18n="settings">Settings</a>
          <a href="admin.html" class="dropdown-item" data-i18n="admin" id="adminBtn" style="display:none;">Admin</a>
          <a href="chat.html" class="dropdown-item" data-i18n="chat">Chat</a>
          <a href="product.html" class="dropdown-item" data-i18n="products">Products</a>
        </div>
      </div>

      <!-- Language Dropdown -->
      <select id="langSelect" class="category-select">
        <option value="en">English</option>
        <option value="lv">Latviešu</option>
      </select>

      <!-- Dark/Light Mode -->
      <button class="icon-btn" id="themeToggle">🌙</button>

      <button class="btn-login" id="loginBtn" data-i18n="login">Login</button>
      <button class="btn-logout" id="logoutBtn" style="display:none;" data-i18n="logout">Logout</button>
    </div>
  </div>
</nav>

<!-- MAIN PRODUCTS SECTION -->
<main class="main-container">

  <!-- Header with Sell Button -->
  <!-- Revenue Stats Banner -->
  <div id="revenueStats" style="display:none; background: var(--card-bg); border-radius: var(--radius-lg); padding: 1.5rem 2rem; margin-bottom: 2rem; box-shadow: var(--shadow-md); border: 1px solid var(--border);">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1.5rem;">
      <div style="text-align:center;">
        <div style="font-size: 2rem; font-weight: 800; color: var(--success);" id="totalRevenue">€0.00</div>
        <div style="font-size: 0.875rem; color: var(--muted);">Total Revenue</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size: 2rem; font-weight: 800; color: var(--primary);" id="totalSold">0</div>
        <div style="font-size: 0.875rem; color: var(--muted);">Products Sold</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size: 2rem; font-weight: 800; color: var(--accent);" id="totalActive">0</div>
        <div style="font-size: 0.875rem; color: var(--muted);">Active Listings</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size: 2rem; font-weight: 800; color: var(--error);" id="totalLikes">0</div>
        <div style="font-size: 0.875rem; color: var(--muted);">Total Likes</div>
      </div>
    </div>
  </div>

  <div class="section-header" style="justify-content: space-between; align-items: center;">
    <div>
      <h2 class="section-title" data-i18n="myProducts">My Products</h2>
      <p class="section-subtitle" data-i18n="manageYourProducts">Manage and view your posted products</p>
    </div>
    <button class="btn-hero-primary" id="sellNowBtn" style="padding: 0.75rem 1.5rem;">
      <span data-i18n="sellNewProduct">Sell New Product</span>
    </button>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs" style="margin-bottom: 2rem;">
    <button class="filter-tab active" data-filter="all" data-i18n="allProducts">All Products</button>
    <button class="filter-tab" data-filter="active" data-i18n="activeProducts">Active</button>
    <button class="filter-tab" data-filter="sold" data-i18n="soldProducts">Sold</button>
    <button class="filter-tab" data-filter="favorites" data-i18n="favorites" id="favoritesTab" style="display: none;">❤️ Favorites</button>
  </div>

  <!-- Products Grid -->
  <div class="product-grid-modern" id="productGrid">
    <!-- Product cards will be inserted here -->
    <div style="padding:20px;text-align:center;grid-column:1/-1;color:var(--muted);">
      <span data-i18n="loading">Loading products...</span>
    </div>
  </div>

  <!-- Empty State -->
  <div id="emptyState" style="display: none; text-align: center; padding: 4rem 2rem;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">📦</div>
    <h3 style="margin-bottom: 1rem;" data-i18n="noProductsYet">No Products Yet</h3>
    <p style="color: var(--muted); margin-bottom: 2rem;" data-i18n="startSelling">Start selling by listing your first product</p>
    <button class="btn-hero-primary" id="sellNowEmptyBtn" data-i18n="sellFirstProduct">Sell Your First Product</button>
  </div>

</main>

<!-- User Profile Modal -->
<div id="userProfileModal" class="product-modal" style="display: none;">
  <div class="modal-overlay" id="profileModalOverlay"></div>
  <div class="modal-content" style="max-width: 800px;">
    <button class="modal-close" id="profileModalClose">×</button>
    <div class="modal-body" id="profileModalContent">
      <!-- Profile content will be inserted here -->
    </div>
  </div>
</div>

<!-- Load main runtime first, then page script (main.js imports navbar.js) -->

</body>
</html>
