[build]
  base = "/"                  
  publish = "dist"
  command = "npm ci && npx vite build"   # Ensure fresh install + build
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "development"     # Ensures devDependencies are installed
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
