[build]
  command = "npx vite build"     # Use npx to call Vite directly
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "development"       # Force devDependencies to be installed
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
