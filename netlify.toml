[build]
  base    = "/"                  
  command = "node ./node_modules/vite/bin/vite.js build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "development"      
  NODE_VERSION = "20"           

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
