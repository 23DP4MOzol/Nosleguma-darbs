[build]
  base    = "/"
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# API function redirect
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA redirect (all other routes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
