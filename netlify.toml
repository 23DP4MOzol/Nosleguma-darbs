[build]
  base    = "/"                  # Your project root
  publish = "dist"               # Folder generated by npm run build
  command = "npx --yes vite build"   # Use npx --yes to avoid permission issues
  functions = "netlify/functions"    # Serverless functions folder

[build.environment]
  NODE_ENV = "development"      # Ensures devDependencies are installed
  NODE_VERSION = "20"           # Recommended Node version for Vite

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
